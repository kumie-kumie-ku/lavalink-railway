# Lavalink 4.x — application.yml for the Altare Docker App deploy.
#
# Image: ghcr.io/lavalink-devs/lavalink:4.2.2  (4.2+ is required: Discord's
# DAVE encrypted voice landed March 2026 and older Lavalink cannot play.)
# Mount this file at /opt/Lavalink/application.yml and set the
# LAVALINK_PASSWORD env var on the Docker App. Do NOT put a real password
# in this file.
#
# Sources: Lavalink 4 docs + youtube-source plugin README
# (dev.lavalink.youtube:youtube-plugin). The built-in YouTube source MUST
# stay off — the plugin replaces it.


server:
  port: 2333
  address: 0.0.0.0


lavalink:
  plugins:
    # Pin to the latest youtube-plugin release at deploy time; 1.18.2 was
    # current when this file was written.
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
  server:
    password: "${LAVALINK_PASSWORD}"
    sources:
      youtube: false # handled by the youtube-source plugin, not the built-in
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
    bufferDurationMs: 400
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true


plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Clients are queried in the order given; the first that loads wins.
    # TV is LAST on purpose: the anonymous clients handle everything they
    # can, and TV (the only OAuth-compatible client — it does playback
    # only, no metadata/search) is only tried when the others refuse a
    # video. Without TV in this list the OAuth login is never used for
    # playback — Lavalink even warns "OAuth has been enabled without
    # registering any OAuth-compatible clients" — and login-gated videos
    # fail on every client. Added 2026-11-24 after !play freak kept
    # failing with "This video requires login" despite a saved token.
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
      - TV
    # OAuth: refresh token saved 2026-11-24 ~01:54 as Railway variable
    # PLUGINS_YOUTUBE_OAUTH_REFRESHTOKEN (Spring relaxed binding maps it
    # to plugins.youtube.oauth.refreshToken) so restarts skip the device
    # flow. Burner account only — Google may ban accounts used for this.
    oauth:
      enabled: true
      # refreshToken: "${PLUGINS_YOUTUBE_OAUTH_REFRESHTOKEN:}"
    # If YouTube starts blocking the node, add InnerTube OAuth tokens from
    # a THROWAWAY Google account here (never Kumie's real account, never in
    # chat — vaulted like any other credential). See the youtube-source
    # README section "Using OAuth tokens".


metrics:
